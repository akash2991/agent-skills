# Copy to .github/workflows/pr-rules.yml in a project. Runs the mechanical git-workflow-and-versioning rules on every PR
# (P2/P3 commit messages, P5 branch, P10 title, P11 size, P13 changelog); see skills/git-workflow-and-versioning/SKILL.md.
name: pr-rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-rules:
    # Dependency bots do not carry trailers or changelog lines; their own tooling reviews them.
    # Dependabot and Renovate only; a GitHub App that opens agent PRs is held to the rules.
    if: ${{ !contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the PR against the git workflow rules
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Set the repository variable LINEAR_TEAM (e.g. ENG) to accept only that team's ticket ids.
          LINEAR_TEAM: ${{ vars.LINEAR_TEAM }}
          # Set BRAIN_LONG_LIVED (e.g. ^(staging|develop)$) for the long-lived branches P16 allows besides main and release/*.
          BRAIN_LONG_LIVED: ${{ vars.BRAIN_LONG_LIVED }}
        run: |
          # The checker script and the diff attributes come from the base branch, never from the PR. This workflow file
          # itself runs from the PR, so protect .github/ with CODEOWNERS or a ruleset.
          # So the PR that first adds the brain fails here: merge the brain into the base branch before adding this workflow.
          CHECK_PATH="$(git ls-tree -r --name-only "origin/$BASE_REF" | { grep '/skills/git-workflow-and-versioning/scripts/brain-git-check.js$' || true; } | head -1)"
          test -n "$CHECK_PATH" || { echo "brain-git-check.js is not on $BASE_REF: merge the brain into $BASE_REF before adding this workflow"; exit 1; }
          CHECK="$RUNNER_TEMP/brain-git-check.js"
          git show "origin/$BASE_REF:$CHECK_PATH" > "$CHECK"
          # Run every check and fail once at the end, so one failure does not hide the others.
          status=0
          node "$CHECK" branch "$HEAD_REF" || status=1
          node "$CHECK" commits --base "origin/$BASE_REF" --head "$HEAD_SHA" || status=1
          node "$CHECK" pr --base "origin/$BASE_REF" --head "$HEAD_SHA" || status=1
          exit $status
