openapi: 3.1.0
info:
  title: kreate-mini
  version: 0.3.0
paths:
  /jobs/{id}:
    get:
      operationId: getJob
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
components:
  schemas:
    JobDetail:
      type: object
      additionalProperties: false
      required: [id, post_id, status]
      properties:
        id: { type: string }
        post_id: { type: string }
        status: { type: string, enum: [queued, running, done] }
